<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>مغز پروژه</title>
  <link rel="stylesheet" href="/styles.css?v=0.8.1">
  <link rel="stylesheet" href="/ui-v2.css?v=0.8.1">
  <link rel="stylesheet" href="/execution-dashboard.css?v=0.8.1">
  <link rel="stylesheet" href="/github-integration.css?v=0.8.1">
  <link rel="stylesheet" href="/runtime-inspector.css?v=0.8.1">
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="dot"></div><div><strong>مغز پروژه</strong><small>اتاق فرمان پروژه‌های شما</small></div></div>
      <button id="newProjectBtn" class="primary full">+ ایده / پروژه تازه</button>
      <div id="health" class="health">در حال بررسی Codex…</div>
      <div class="side-title"><span>پروژه‌ها</span><small>حافظه و وضعیت</small></div>
      <div id="projectList"></div>
    </aside>
    <main id="main"></main>
  </div>

  <template id="newProjectTemplate">
    <section class="panel hero">
      <div class="architect-banner">
        <div class="architect-mark">✦</div>
        <div><strong>شکل دادن ایده</strong><small>برداشت → روشن‌سازی → اجرا</small></div>
        <span class="step-badge">مرحله ۱ از ۳</span>
      </div>

      <h1>ایده چیه؟</h1>
      <p class="hero-copy">ایده را یک‌جا بنویس یا بگو. اول فقط برداشت من را چک می‌کنی؛ بعد نقشه اجرا ساخته می‌شود.</p>

      <div class="field-head">
        <div><label for="idea">توضیح ایده</label><span class="field-hint">هر چیزی که الان می‌دانی؛ لازم نیست رسمی باشد.</span></div>
        <button id="ideaVoiceBtn" class="voice-btn" type="button">🎙 گفتن ایده · ۱۵ث</button>
      </div>
      <textarea id="idea" rows="6" placeholder="ایده را اینجا بنویس یا با صدا بگو…"></textarea>
      <div id="ideaVoiceStatus" class="voice-status" aria-live="polite"></div>

      <div class="grid2">
        <div><label for="profileHint">نوع پروژه <span class="optional">اختیاری</span></label><select id="profileHint"><option value="">تشخیص خودکار</option><option value="writing">نوشتن / محتوا</option><option value="coding">نرم‌افزار / کدنویسی</option><option value="research">پژوهش / تحلیل</option><option value="planning">برنامه‌ریزی</option><option value="general">عمومی / ترکیبی</option></select></div>
        <div><label for="workspacePath">پوشه کاری <span class="optional">اختیاری</span></label><input id="workspacePath" class="ltr" placeholder="/Users/me/project یا خالی"></div>
      </div>

      <label class="check"><input type="checkbox" id="webSearch"> اگر لازم شد، جست‌وجوی وب مجاز باشد</label>

      <div class="actions form-actions">
        <button id="quickTestBtn" class="secondary" type="button">قرار دادن نمونه</button>
        <button id="analyzeBtn" class="primary large" type="button">تصویر ایده</button>
        <button id="cancelDiscoveryBtn" class="danger" type="button" hidden>لغو ساخت تصویر</button>
      </div>
      <div id="discovery"></div>
    </section>
  </template>

  <script src="/stable-project-refresh.js?v=0.8.1"></script>
  <script type="module" src="/app.js?v=0.8.1"></script>
  <script type="module" src="/execution-dashboard.js?v=0.8.1"></script>
  <script type="module" src="/github-integration.js?v=0.8.1"></script>
  <script type="module" src="/runtime-inspector.js?v=0.8.1"></script>
</body>
</html>
