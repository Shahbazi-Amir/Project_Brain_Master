<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مغز پروژه</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="dot"></div><div><strong>مغز پروژه</strong><small>سیستم‌عامل محلی پروژه‌ها</small></div></div>
      <button id="newProjectBtn" class="primary full">+ پروژه جدید</button>
      <div id="health" class="health">در حال بررسی Codex…</div>
      <h4>پروژه‌ها</h4><div id="projectList"></div>
    </aside>
    <main id="main"></main>
  </div>
  <template id="newProjectTemplate">
    <section class="panel hero">
      <span class="eyebrow">معمار پروژه</span>
      <h1>ایده خام را به یک پروژه قابل اجرا تبدیل کن.</h1>
      <p>مغز پروژه قبل از شروع اجرا، هدف، محدوده، معیار کیفیت، مراحل و تصمیم‌های لازم را مشخص می‌کند.</p>
      <label>می‌خواهی به چه نتیجه‌ای برسی؟</label>
      <textarea id="idea" rows="7" placeholder="مثال: می‌خواهم یک ابزار محلی بسازم که…"></textarea>
      <div class="grid2">
        <div><label>نوع پروژه</label><select id="profileHint"><option value="">تشخیص خودکار</option><option value="writing">نوشتن / کتاب</option><option value="coding">کدنویسی</option><option value="research">پژوهش</option><option value="planning">برنامه‌ریزی</option><option value="general">عمومی</option></select></div>
        <div><label>مسیر پوشه کاری روی مک (اختیاری)</label><input id="workspacePath" class="ltr" placeholder="/Users/me/project یا خالی بگذار"></div>
      </div>
      <label class="check"><input type="checkbox" id="webSearch"> در مرحله تحلیل، جست‌وجوی وبِ به‌روز مجاز باشد</label>
      <div class="actions form-actions"><button id="analyzeBtn" class="primary">تحلیل پروژه</button><button id="quickTestBtn" class="secondary" type="button">پر کردن تست سریع</button></div>
      <div id="discovery"></div>
    </section>
  </template>
  <script type="module" src="/app.js"></script>
</body></html>
