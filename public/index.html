<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مغز پروژه</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="dot"></div>
        <div><strong>مغز پروژه</strong><small>اتاق فرمان پروژه‌های شما</small></div>
      </div>
      <button id="newProjectBtn" class="primary full">+ ایده / پروژه تازه</button>
      <div id="health" class="health">در حال بررسی Codex…</div>
      <div class="side-title"><span>پروژه‌ها</span><small>حافظه و وضعیت</small></div>
      <div id="projectList"></div>
    </aside>

    <main id="main"></main>
  </div>

  <template id="newProjectTemplate">
    <section class="panel hero">
      <div class="architect-banner">
        <div class="architect-mark">✦</div>
        <div>
          <strong>کارگاه شکل‌گیری پروژه</strong>
          <small>تصویر ایده → روشن‌سازی → قرارداد اجرا</small>
        </div>
        <span class="step-badge">مرحله ۱ از ۳</span>
      </div>

      <div class="journey" aria-label="مراحل شکل‌گیری پروژه">
        <div class="journey-step active"><b>۱</b><span>تصویر ایده</span></div>
        <div class="journey-line"></div>
        <div class="journey-step"><b>۲</b><span>روشن‌سازی</span></div>
        <div class="journey-line"></div>
        <div class="journey-step"><b>۳</b><span>قرارداد اجرا</span></div>
      </div>

      <h1>ایده چیه؟</h1>
      <p class="hero-copy">هرچه در ذهن داری یک‌جا بگو. اول برداشت من را می‌بینی، بعد فقط جاهای مهم را با چند گزینه اصلاح می‌کنی.</p>

      <div class="field-head">
        <div>
          <label for="idea">توضیح ایده</label>
          <span class="field-hint">هدف، خروجی، مخاطب، محدودیت یا هر چیزی که الان می‌دانی.</span>
        </div>
        <button id="ideaVoiceBtn" class="voice-btn" type="button" aria-label="ورودی صوتی ایده">🎙 گفتن ایده · ۳۰ث</button>
      </div>
      <textarea id="idea" rows="8" placeholder="مثال: می‌خواهم متنی تولید کنم که بعداً به صوت تبدیل شود؛ مخاطب فارسی‌زبان است و خروجی نهایی برای انتشار عمومی خواهد بود…"></textarea>
      <div id="ideaVoiceStatus" class="voice-status" aria-live="polite"></div>

      <div class="grid2">
        <div>
          <label for="profileHint">نوع پروژه <span class="optional">اختیاری</span></label>
          <select id="profileHint">
            <option value="">تشخیص خودکار</option>
            <option value="writing">نوشتن / کتاب / محتوا</option>
            <option value="coding">نرم‌افزار / کدنویسی</option>
            <option value="research">پژوهش / تحلیل</option>
            <option value="planning">برنامه‌ریزی / طراحی مسیر</option>
            <option value="general">عمومی / ترکیبی</option>
          </select>
        </div>
        <div>
          <label for="workspacePath">پوشه کاری روی مک <span class="optional">اختیاری</span></label>
          <input id="workspacePath" class="ltr" placeholder="/Users/me/project یا خالی بگذار">
        </div>
      </div>

      <label class="check"><input type="checkbox" id="webSearch"> اگر برای فهم ایده لازم شد، جست‌وجوی وب مجاز باشد</label>

      <div class="actions form-actions">
        <button id="analyzeBtn" class="primary large">تصویر ایده</button>
        <button id="quickTestBtn" class="secondary" type="button">نمونه ساده</button>
      </div>
      <div id="discovery"></div>
    </section>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
