name: Actions Storage Monitor

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
      - Actions Artifact Retention
    types:
      - requested
      - in_progress
      - completed
  schedule:
    - cron: "*/30 * * * *"

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: actions-storage-monitor-${{ github.repository }}
  cancel-in-progress: true

jobs:
  refresh-local-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6

      - name: Refresh storage and workflow activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_ISSUE_NUMBER: "10"
        run: python3 .github/scripts/actions_storage_local_monitor.py
