<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مغز پروژه</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="dot"></div>
        <div><strong>مغز پروژه</strong><small>اتاق فرمان پروژه‌های شما</small></div>
      </div>
      <button id="newProjectBtn" class="primary full">+ ایده / پروژه تازه</button>
      <div id="health" class="health">در حال بررسی Codex…</div>
      <div class="side-title"><span>پروژه‌ها</span><small>حافظه و وضعیت هر پروژه</small></div>
      <div id="projectList"></div>
    </aside>

    <main id="main"></main>
  </div>

  <template id="newProjectTemplate">
    <section class="panel hero">
      <div class="architect-banner">
        <div class="architect-mark">✦</div>
        <div>
          <strong>کارگاه شکل‌گیری پروژه</strong>
          <small>اول تصویر ایده روشن می‌شود، بعد ایده پخته می‌شود و در پایان نقشه اجرا ساخته می‌شود.</small>
        </div>
        <span class="step-badge">مرحله ۱ از ۳</span>
      </div>

      <div class="journey" aria-label="مراحل شکل‌گیری پروژه">
        <div class="journey-step active"><b>۱</b><span>تصویر ایده</span></div>
        <div class="journey-line"></div>
        <div class="journey-step"><b>۲</b><span>پخته‌سازی</span></div>
        <div class="journey-line"></div>
        <div class="journey-step"><b>۳</b><span>نقشه اجرا</span></div>
      </div>

      <h1>اول بفهمیم دقیقاً چه چیزی می‌خواهی بسازی</h1>
      <p class="hero-copy">ایده لازم نیست کامل باشد. آن را همان‌طور که در ذهن داری بنویس یا بگو. معمار پروژه ابتدا ماهیت ایده، محصول یا خروجی نهایی، ارزش آن و راه‌های رسیدن به نتیجه را تصویر می‌کند؛ بعد فقط سؤال‌هایی را می‌پرسد که واقعاً روی مسیر اثر دارند.</p>

      <div class="field-head">
        <div>
          <label for="idea">ایده‌ی اولیه</label>
          <span class="field-hint">چه چیزی در ذهن داری، برای چه کسی و به چه نتیجه‌ای می‌خواهی برسی؟</span>
        </div>
        <button id="ideaVoiceBtn" class="voice-btn" type="button" aria-label="ورودی صوتی ایده">🎙 گفتن ایده</button>
      </div>
      <textarea id="idea" rows="8" placeholder="مثال: می‌خواهم یک کتاب کاربردی برای مدیران تازه‌کار بنویسم که تجربه‌های واقعی را به یک مسیر عملی تبدیل کند…"></textarea>
      <div id="ideaVoiceStatus" class="voice-status" aria-live="polite"></div>

      <div class="grid2">
        <div>
          <label for="profileHint">ماهیت احتمالی پروژه</label>
          <select id="profileHint">
            <option value="">تشخیص خودکار</option>
            <option value="writing">نوشتن / کتاب / محتوا</option>
            <option value="coding">نرم‌افزار / کدنویسی</option>
            <option value="research">پژوهش / تحلیل</option>
            <option value="planning">برنامه‌ریزی / طراحی مسیر</option>
            <option value="general">عمومی / ترکیبی</option>
          </select>
        </div>
        <div>
          <label for="workspacePath">پوشه کاری روی مک <span class="optional">اختیاری</span></label>
          <input id="workspacePath" class="ltr" placeholder="/Users/me/project یا خالی بگذار">
        </div>
      </div>

      <label class="check"><input type="checkbox" id="webSearch"> اگر برای فهم بهتر ایده لازم شد، جست‌وجوی وبِ به‌روز مجاز باشد</label>

      <div class="actions form-actions">
        <button id="analyzeBtn" class="primary large">تصویر کردن ایده</button>
        <button id="quickTestBtn" class="secondary" type="button">نمونه ساده</button>
      </div>
      <div id="discovery"></div>
    </section>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
